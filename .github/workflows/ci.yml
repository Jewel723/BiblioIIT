name: CI — Tests BiblioIIT

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    name: Validation pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation de pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Exécution de la suite de tests unitaires & intégration
        run: |
          PYTHONPATH=. pytest -v
